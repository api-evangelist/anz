- aid: anz:anz-confirmation-of-payee-api
  name: Australia and New Zealand Banking Group (ANZ) Confirmation of Payee API
  tags:
  - Payments
  - Confirmation of Payee
  - Scam Prevention
  - Validation
  - Business Banking
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.online.anz.com/
  baseURL: https://developer.online.anz.com/
  properties:
  - url: https://developer.online.anz.com/
    type: DeveloperPortal
  description: >-
    ANZ's first-party Confirmation of Payee API matches a recipient's account name against their BSB and
    account number to reduce mistaken and mistakenly-directed payments and help prevent scams before a
    payment is sent. Documented on the ANZ Developer Portal; access is partner-gated with no public OpenAPI
    specification.
