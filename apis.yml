- aid: anz:anz-cdr-accounts-balances-api
  name: Australia and New Zealand Banking Group (ANZ) CDR Accounts & Balances API
  tags:
  - CDR
  - Open Banking
  - Accounts
  - Balances
  - Banking
  - Consumer Authorized
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.anz.com.au/support/legal/anz-apis/
  baseURL: https://api.anz/cds-au/v1/banking/accounts
  properties:
  - url: https://www.anz.com.au/support/legal/anz-apis/
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#cdr-banking-api_get-accounts
    type: APIReference
  - url: openapi/anz-cds-banking-products-openapi.yml
    type: OpenAPI
  description: ANZ's consumer-authorized CDR account and balance endpoints (Get Accounts,
    Get Bulk Balances, Get Account Balance, Get Account Detail) defined by the DSB
    Consumer Data Standards Banking API v1.36.0. Unlike Product Reference Data these
    are NOT public — a consumer must authorize an accredited data recipient (ADR) via
    the CDR OAuth2 / OpenID Connect FAPI flow, and calls run over the mutual-TLS data
    holder host. ANZ implements this surface as a designated CDR data holder.
