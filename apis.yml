  name: Australia and New Zealand Banking Group (ANZ) CDR Product Reference Data API
  tags:
  - CDR
  - Open Banking
  - Product Reference Data
  - Banking
  - Public
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.anz.com.au/support/legal/anz-apis/
  baseURL: https://api.anz/cds-au/v1/banking/products
  properties:
  - url: https://www.anz.com.au/support/legal/anz-apis/
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#cdr-banking-api_get-products
    type: APIReference
  - url: openapi/anz-cds-banking-products-openapi.yml
    type: OpenAPI
  description: ANZ's public, unauthenticated Consumer Data Right Product Reference
    Data (PRD) API for the primary ANZ brand. It returns the bank's publicly offered
    banking products (accounts, cards, loans, overdrafts) as defined by the DSB Consumer
    Data Standards. Requires the CDS version header (x-v; version 4 and 5 confirmed
    live returning HTTP 200 with a data.products array).
