name: Australia and New Zealand Banking Group (ANZ)
kind: company
description: Australia and New Zealand Banking Group Limited (ANZ) is one of Australia's
  "Big Four" banks, a publicly listed company (ASX and NZX code ANZ) headquartered in Melbourne
  that provides retail, commercial, and institutional banking across Australia, New
  Zealand, and internationally. ANZ is not a mutual or customer-owned institution;
  it is a shareholder-owned Authorised Deposit-taking Institution (ADI) regulated by
  APRA. As a designated data holder under Australia's Consumer Data Right (CDR / Open
  Banking), ANZ exposes a public, unauthenticated Product Reference Data (PRD) API
  conforming to the Data Standards Body (DSB) Consumer Data Standards, and operates
  a separate CDR brand endpoint for ANZ Plus. Consumer data sharing beyond product
  reference data is gated behind the CDR accredited-data-recipient (ADR) model using
  OAuth2 / OpenID Connect FAPI security profiles.
