- aid: anz:anz-banking-account-balances-api
  name: Australia and New Zealand Banking Group (ANZ) Banking Account Balances API
  description: 'Banking Account Balance endpoints. Authenticated CDR consumer-data endpoint, reachable only by accredited data recipients over
    mTLS with FAPI OAuth; ANZ''s authenticated resource base URI is distributed via the CDR Register to accredited recipients and is not stated
    in ANZ''s public docs. Contract is the Data Standards Body''s Consumer Data Standards Banking API v1.36.0 (contact contact@dsb.gov.au); ANZ
    implements it as a designated CDR data holder: ANZ''s own page https://www.anz.com.au/support/legal/anz-apis/ states its Product APIs "have
    been developed in accordance with the Consumer Data Standards" at https://api.anz/cds-au/v1/banking/products, and the CDR Register (api.cdr.gov.au
    brands/summary, probed 2026-10-20) lists brand ANZ with publicBaseUri https://api.anz.'
