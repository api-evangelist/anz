- aid: anz:anz-payments-api
  name: Australia and New Zealand Banking Group (ANZ) Payments API
  tags:
  - Payments
  - NPP
  - Direct Entry
  - Business Banking
  - Institutional
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.online.anz.com/
  baseURL: https://developer.online.anz.com/
  properties:
  - url: https://developer.online.anz.com/
    type: DeveloperPortal
  description: >-
    ANZ's first-party Payments API suite on the ANZ Developer Portal, letting business and institutional
    customers automate and optimise payment workflows across domestic payment rails (NPP / direct entry).
    Access is partner-gated — customers onboard through the ANZ Developer Portal with OAuth 2.0 and API
    key management, and no public OpenAPI specification is published (partner-gated onboarding).
- aid: anz:anz-payto-api
  name: Australia and New Zealand Banking Group (ANZ) PayTo API
  tags:
  - Payments
  - PayTo
  - NPP
  - Real-Time Payments
  - Business Banking
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.online.anz.com/
  baseURL: https://developer.online.anz.com/
  properties:
  - url: https://developer.online.anz.com/
    type: DeveloperPortal
  description: >-
    ANZ's first-party PayTo API (also available as a file channel) for real-time account-to-account payments
    and PayTo mandate management over the New Payments Platform (NPP). Documented on the ANZ Developer
