  - url: https://consumerdatastandardsaustralia.github.io/standards/#cdr-banking-api_get-transactions-for-account
    type: APIReference
  - url: openapi/anz-cds-banking-products-openapi.yml
    type: OpenAPI
  description: ANZ's consumer-authorized CDR transaction endpoints (Get Transactions
    For Account, Get Transaction Detail) from the DSB Consumer Data Standards Banking
    API v1.36.0. Consumer-authorized via the CDR ADR model (OAuth2 / OIDC FAPI) over
    the mutual-TLS data holder host; supports transaction filtering by date, amount,
    and text as defined by the shared standard. Not a public endpoint.
