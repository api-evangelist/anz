docs:
- https://developer.online.anz.com/How-it-works?path=Sandbox
- https://developer.online.anz.com/How-it-works?path=Test-data-for-sandbox
description: ANZ's Sandbox environment provides a secure, isolated space for developers to test and experiment with
  API integrations without affecting live systems.
scope: 'ANZ Developer Portal (Fileactive) products: PayTo, AU Payments, Statements, Confirmation of Payee, PayID
  Check, FX, Real-Time Notification. The CDR Product Reference Data API is public and has no sandbox.'
access:
  signup: Requires sign up on the developer portal; create an App via the Sandbox screen to generate Client IDs
    and API keys / RSA keys.
  app_expiry: By default, an App is set to expire 30 days after creation. To extend your App's expiry, please contact
    the support team by submitting a request through the support form and providing the App's Client ID.
environments:
- name: sandbox
  base_urls:
  - https://api.sandbox.online.anz.com/wd
  - https://api.sandbox.online.anz.com/wd/fa-fx
  - https://api.sandbox.online.anz.com/wd/fa-accounts
  source: servers[] of the OpenAPI documents embedded in the product Build pages
- name: uat
  base_urls:
  - https://api.fileactive.anznp.com
- name: production
  base_urls:
  - https://api.fileactive.anz.com
stateful:
  supported: true
  retention: The data created within the Sandbox is stored for up to 30 days
auth: OAuth2 client credentials grant with a customer-signed JWT client_assertion (urn:ietf:params:oauth:client-assertion-type:jwt-bearer)
  plus an apikey header; for Sandbox the apikey and signing private key come from the App details screen.
payload_security:
  note: PayTo and Payment APIs require request payloads secured with JWS then JWE inside a secured_payload object.
  jws:
  - algorithm: PS512
    key_size: 2048 or 4096
  jwe:
  - algorithm: RSA-OAEP
    encryption: A256GCM
    key_size: 2048
webhook_simulation: For Sandbox, these notification payloads are simulated and displayed on the respective app screen
  for user reference. The App screen will display the last 10 webhook notifications.
self_service_testing:
- name: RTN SelfService Testing API
  description: The RTN SelfService Testing API allows you to simulate inbound NPP RealTime Notification events to
    your webhook
  scope: AU.INSTO.TESTING.NPP.RTN.CREATE
  docs: https://developer.online.anz.com/product/Real-Time%20Notification/build
- name: PayTo testing (mandate notification / query simulation)
